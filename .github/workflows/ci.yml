# Runs on every push and pull request. Vercel deploys from Git on its own;
# this workflow is the quality gate that tells you if a change broke something.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build + deployment checks (SEO tags, JSON-LD, broken links)
        run: npm run build
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Functional tests (desktop, tablet, mobile)
        run: npx playwright test
      - name: Lighthouse (performance, accessibility, SEO budgets)
        run: npx -y @lhci/cli@0.14.x autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
